[build]
  command = "npm run build"
  publish = "dist"

# Orión (investigadores): alcance /app/ — no anida a reps/db/status/parpadeómetro
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/app/"
  status = 302

[[redirects]]
  from = "/parpadeometro"
  to = "/parpadeometro/index.html"
  status = 200

[[redirects]]
  from = "/parpadeometro/"
  to = "/parpadeometro/index.html"
  status = 200

[[redirects]]
  from = "/status"
  to = "/status/index.html"
  status = 200

[[redirects]]
  from = "/status/"
  to = "/status/index.html"
  status = 200

[[redirects]]
  from = "/db"
  to = "/db/index.html"
  status = 200

[[redirects]]
  from = "/db/"
  to = "/db/index.html"
  status = 200

[[redirects]]
  from = "/reps/aceptar"
  to = "/reps/aceptar.html"
  status = 200

[[redirects]]
  from = "/reps/aceptar/"
  to = "/reps/aceptar.html"
  status = 200

[[redirects]]
  from = "/reps"
  to = "/reps/index.html"
  status = 200

[[redirects]]
  from = "/reps/"
  to = "/reps/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"

[[headers]]
  for = "/db/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/db/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/status/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/status/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/reps/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/reps/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
