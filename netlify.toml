[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/parpadeometro"
  to = "/parpadeometro/index.html"
  status = 200

[[redirects]]
  from = "/parpadeometro/"
  to = "/parpadeometro/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"

[[headers]]
  for = "/parpadeometro/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"
    Cache-Control = "public, max-age=0, must-revalidate"
